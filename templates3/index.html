<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <title>Seznam opravil</title>
</head>

<body>

    <h1>Seznam opravil lista</h1>

    <a href="/add">
        <button>
            Dodaj opravilo
        </button>
    </a>

    <hr>

    {% for task in tasks %}

    <div id="task-{{ task.id }}">

        <p>{{ task.text }}</p>

        <a href="/delete/{{ task.id }}">
            <button>
                Izbrisi
            </button>
        </a>

    </div>

    <hr>

    {% endfor %}


</body>

</html>
