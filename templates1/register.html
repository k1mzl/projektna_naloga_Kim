<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija</title>
</head>
<body>

    <h1>Registracija</h1>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Uporabniško ime"
               required>

        <input type="password"
               name="password"
               placeholder="Geslo"
               required>
        
        <button type="submit">
            Registracija
        </button>       

    </form>

    <a href="/login">
        <button>
            nazaj na prijavo
        </button>
    </a>

</body>
</html>
